זו מהבאות היא הוצאה קבועה?",options:["הלימונים ללימונדה","הקרח לכוסות","שכירות החנות"],correct:2,why:"שכירות משלמים כל חודש, גם אם לא מכרנו אפילו כוס אחת."},{q:"דוכן משלם 90₪ שכירות ביום ומרוויח 3₪ על כל כוס. כמה כוסות צריך למכור כדי להגיע לנקודת האיזון?",options:["3 כוסות","30 כוסות","90 כוסות"],correct:1,why:"90 לחלק ל-3 זה 30. רק מהכוס ה-31 מתחיל רווח אמיתי."},{q:"עסק מכר ב-1,000₪ החודש והוציא 1,200₪. מה המצב שלו?",options:["רווח של 200₪","איזון מושלם","הפסד של 200₪"],correct:2,why:"ההוצאות גדולות מההכנסות ב-200₪, ולכן זה הפסד."}]},{id:"b-competition",title:"תחרות: למה טוב שיש כמה מוכרים",emoji:"🥊",points:["כשכמה חנויות מוכרות דברים דומים, כל אחת רוצה שתקנו דווקא אצלה. זו תחרות.","תחרות דוחפת מוכרים להוריד מחירים, לשפר מוצרים ולתת שירות טוב יותר. הקונים מרוויחים.",'"מונופול" הוא מוכר יחיד בלי מתחרים. בלי תחרות הוא יכול לגבות מחיר גבוה ולתת שירות גרוע, ואין לאן לעבור.',"דוגמה: שני דוכני גלידה באותו רחוב. אם אחד יקר מדי, כולם עוברים למתחרה. לכן המחירים נשארים דומים והוגנים.","לא כל התחרות היא על מחיר: חנות יכולה לנצח בטעם מיוחד, במיקום נוח או בשירות מהיר ונעים.","הידעת? במדינות רבות יש רשות להגנה על התחרות, שתפקידה למנוע מונופולים וסיכומי מחירים סודיים בין מוכרים."],quiz:[{q:"נפתחה חנות ירקות שנייה בשכונה. מה כנראה יקרה למחירים?",options:["יירדו או יישארו הוגנים בגלל התחרות","יעלו מאוד","לא ישתנו לעולם"],correct:0,why:"כשיש מתחרה, מוכר יקר מדי מאבד לקוחות."},{q:"מהו מונופול?",options:["חנות קטנה ומשפחתית","מוכר יחיד בלי מתחרים","שוק פתוח בשבת"],correct:1,why:"מונופול = מוכר אחד בלבד, בלי תחרות שתאזן אותו."},{q:"למה מונופול עלול להזיק לקונים?",options:["כי הוא תמיד סגור","כי הוא יכול לגבות מחיר גבוה ולתת שירות גרוע, ואין לאן לעבור","כי הוא מוכר רק דבר אחד"],correct:1,why:"בלי מתחרים אין סיבה להתאמץ בשביל הלקוח."},{q:"חנות לא יכולה להוריד מחירים. איך עוד היא יכולה להתחרות?",options:["לשפר את המוצר או השירות","להעלות מחירים עוד","לסגור מוקדם יותר"],correct:0,why:"תחרות היא גם על איכות, שירות ומיקום, לא רק על מחיר."}]},{id:"b-taxes",title:"מיסים: הקופה המשותפת של כולנו",emoji:"🏛️",points:["מס הוא תשלום שאזרחים ועסקים מעבירים למדינה. יחד הוא יוצר קופה ענקית ומשותפת.","מהקופה הזאת המדינה משלמת על דברים שכולנו משתמשים בהם: בתי ספר, בתי חולים, כבישים, גנים ציבוריים ושירותי חירום.",'יש מס על הכנסה (מס הכנסה) ויש מס שמתווסף למחיר בכל קנייה (מע"מ). קנית משחק ב-100₪? חלק מהמחיר הוא מס.',"אנשים לא תמיד מסכימים כמה מס לגבות: מס גבוה מממן יותר שירותים, אבל משאיר פחות כסף בכיס. על זה מצביעים בבחירות.","דוגמה: הספרייה העירונית, גן המשחקים בשכונה והבריכה העירונית פועלים בזכות המיסים שהתושבים משלמים.",'הידעת? במשחק "העיר שלי" באפליקציה תחלקו את כספי המיסים של עיר שלמה, ותראו מה קורה כשמחליטים לחסוך בבתי ספר.'],quiz:[{q:"מה מממנים המיסים שאנשים משלמים?",options:["רק מתנות לפקידים","שירותים משותפים כמו בתי ספר, כבישים ובתי חולים","ממתקים חינם לכולם"],correct:1,why:"המיסים הם קופה משותפת שמממנת שירותים לכולם."},{q:'קנית צעצוע ב-100₪ והמחיר כולל מע"מ. מה זה אומר?',options:["שהחנות עשקה אותך","שהצעצוע בעצם בחינם","שחלק מה-100₪ עובר למדינה כמס"],correct:2,why:'מע"מ הוא מס שמתווסף למחיר ועובר לקופה המשותפת.'},{q:"אם העירייה תגבה פחות מיסים, מה עלול לקרות?",options:["יהיה פחות כסף לשירותים כמו גנים וספריות","הכבישים ישתפרו מיד","כל התושבים יהיו עשירים"],correct:0,why:"פחות מס = קופה משותפת קטנה יותר = פחות שירותים."},{q:"למה אנשים מסכימים לשלם מס גם על דברים שהם בעצמם לא משתמשים בהם?",options:["כי בקופה המשותפת כולם מקבלים שירותים שקשה לקנות לבד","כי אין להם ברירה בחיים","כי המס חוזר אליהם במזומן"],correct:0,why:"ביחד אפשר לממן בית חולים או בית ספר, דברים שאף אחד לא יכול לקנות לבד."}]},{id:"b-loans",title:"הלוואות וחוב חכם: ללוות בלי ליפול",emoji:"🪤",points:["הלוואה היא כסף שמישהו נותן לך עכשיו, ואתה מתחייב להחזיר בעתיד - עם ריבית.","הריבית על הלוואה גבוהה בהרבה מהריבית שמקבלים על חיסכון. לכן חוב גדל מהר יותר מחיסכון.",'"החזר חודשי" הוא הסכום שמשלמים כל חודש. הלוואה ארוכה יותר אומרת החזר חודשי קטן יותר, אבל יותר ריבית בסך הכול.',"חוב חכם מממן דבר שמחזיר ערך לאורך זמן, כמו לימודים. חוב מסוכן מממן דחף ששוכחים ממנו מחר.","דוגמה: הלוואה של 100₪ בריבית 10% לשנה. אחרי שנה מחזירים 110₪. אם דוחים עוד שנה, כבר 121₪. הריבית דריבית עובדת נגד הלווה.","הידעת? לפני הלוואה אמיתית חותמים על חוזה ארוך. מבוגרים חכמים בודקים את הריבית ואת סך ההחזר הכולל, לא רק את ההחזר החודשי."],quiz:[{q:"לווית 200₪ בריבית 10% לשנה, לשנה אחת. כמה תחזיר בסוף השנה?",options:["200₪ בדיוק","210₪","220₪"],correct:2,why:"10% מ-200 זה 20, ולכן מחזירים 200 ועוד 20, סך הכול 220."},{q:"למה חוב מסוכן יותר מחיסכון איטי?",options:["כי הריבית על חוב גבוהה והחוב גדל מהר נגדך","כי בבנק לא אוהבים חובות","כי אי אפשר לקנות בו דברים"],correct:0,why:"אותה ריבית דריבית שעוזרת לחוסך עובדת נגד הלווה."},{q:"מה נכון לגבי הלוואה לתקופה ארוכה יותר?",options:["ההחזר החודשי קטן יותר, אבל סך הריבית שמשלמים גדול יותר","תמיד משלמים פחות בסך הכול","הריבית נעלמת"],correct:0,why:"פריסה ארוכה נראית נוחה בחודש, אבל עולה יותר בסוף."},{q:'מהו "חוב חכם"?',options:["חוב לקניית ממתקים","חוב שמממן דבר שמחזיר ערך לאורך זמן, כמו לימודים","חוב שלא צריך להחזיר"],correct:1,why:"חוב חכם משקיע בעתיד. חוב על דחף חולף הוא מלכודת."}]},{id:"b-currency",title:"מטבעות של העולם: שער חליפין",emoji:"💱",points:["כמעט לכל מדינה יש מטבע משלה: בישראל שקל, בארצות הברית דולר, באירופה יורו.",'כשטסים לחו"ל או קונים דבר מחו"ל ממירים כסף. שער החליפין אומר כמה יחידות של מטבע אחד מקבלים תמורת השני.','שער החליפין משתנה כל הזמן, כמו מחיר: כשהרבה אנשים רוצים שקלים, השקל "מתחזק" וקונה יותר דולרים.','שקל חזק: מוצרים מחו"ל וטיולים זולים יותר. שקל חלש: המוצרים המיובאים מתייקרים, אבל מי שמוכר לחו"ל מרוויח יותר.',"דוגמה: אם דולר שווה 4₪, משחק שעולה 10 דולר יעלה לך 40₪. אם הדולר ירד ל-3.5₪, אותו משחק יעלה רק 35₪.","הידעת? לפני שהומצא המטבע שילמו בצדפים, במלח ובאבנים ענקיות. המטבע הראשון נטבע לפני כ-2,700 שנה."],quiz:[{q:"דולר אחד שווה 4₪. כמה עולה בשקלים צעצוע של 10 דולר?",options:["14₪","40₪","25₪"],correct:1,why:"10 דולר כפול 4₪ לדולר זה 40₪."},{q:'השקל התחזק ועכשיו דולר שווה רק 3.5₪ במקום 4₪. מה קרה למחיר של משחק מחו"ל?',options:["הוזל","התייקר","לא השתנה"],correct:0,why:"כשהשקל חזק, כל שקל קונה יותר דולרים, ולכן מוצרים בדולרים מתחילים לעלות פחות שקלים."},{q:"למה שער חליפין דומה למחיר?",options:["כי הוא קבוע לנצח","כי קובעים אותו פעם בשנה","כי הוא משתנה לפי כמה אנשים רוצים את המטבע"],correct:2,why:"בדיוק כמו היצע וביקוש: ביקוש גדול לשקל מחזק אותו."},{q:"מי נהנה כשהשקל חלש (והדולר יקר)?",options:['מי שקונה מוצרים מחו"ל',"אף אחד לא נהנה","יצואנים שמוכרים בדולרים וממירים לשקלים"],correct:2,why:"הם מקבלים דולרים, וכל דולר שווה עכשיו יותר שקלים."}]}];function Ee(e){return"loading"===e?"טוענים את ההתקדמות השמורה…":"saving"===e?"שומרים את ההתקדמות…":"saved"===e?"ההתקדמות נשמרה במכשיר הזה":"ההתקדמות לא נשמרה. השינויים יישארו רק כל עוד הדף פתוח."}var Le=s(g()),Me=[{id:"micro",title:"מיקרו-כלכלה",sub:"החנות הקטנה של העולם: קונים, מוכרים ומחירים",emoji:"🏪"},{id:"macro",title:"מאקרו-כלכלה",sub:"התמונה הגדולה: אינפלציה, בנקים וסחר",emoji:"🌍"},{id:"money",title:"כסף חכם",sub:"חיסכון, תקציב וזהירות",emoji:"💰"}],Oe=[{id:"scarcity",module:"micro",title:"מחסור: רוצים הכל, אי אפשר הכל",emoji:"🧺",points:['"מחסור" אומר שיש פחות ממה שכולם רוצים: כסף, זמן, ממתקים, אפילו דקות של משחק.',"בגלל המחסור אנחנו חייבים לבחור. אי אפשר לקחת הכל.","כלכלה היא בעצם הדרך שאנשים בוחרים בה כשלא הכל אפשרי.","גם זמן הוא משאב במחסור: שעה של משחק במחשב היא שעה שלא תהיה לכדורגל או לקריאה.","דוגמה: ביום הולדת יש עוגה אחת ועשרה ילדים רעבים. חייבים לחלק אותה, וכל חלוקה היא בחירה.","הידעת? גם מדינות עשירות מתמודדות עם מחסור: יש גבול לכמה רופאים, בתי ספר וכבישים אפשר לממן באותה שנה."],game:"budget",quiz:[{q:'מה זה "מחסור"?',options:["מצב שיש פחות ממה שאנשים רוצים","חנות שסגורה בשבת","מחסן בלי אור"],correct:0,why:"מחסור = יש פחות ממה שכולם רוצים, ולכן חייבים לבחור."},{q:"יש לך 10₪. גלידה עולה 6₪ ומשחק קלפים 8₪. מה נכון?",options:["אפשר לקנות את שניהם","אפשר לקנות רק אחד מהם","אי אפשר לקנות כלום"],correct:1,why:"6 ועוד 8 זה 14, ויש רק 10. חייבים לבחור!"},{q:"יש לך 25₪. אתה רוצה ספר ב-18₪, מדבקות ב-5₪ וסוכריות ב-4₪. מה אפשר לקנות?",options:["את כל השלושה","רק את הסוכריות","את הספר והמדבקות"],correct:2,why:"18 ועוד 5 זה 23, וזה בתוך ה-25₪. כל השלושה עולים 27₪, וזה יותר מדי."},{q:"איזה מהבאים הוא דוגמה למחסור של זמן?",options:["בחנות נגמרו הממתקים","יש שעה אחת פנויה ורוצים גם לשחק וגם לצפות בסרט","הכיסא בכיתה שבור"],correct:1,why:"גם זמן מוגבל: בוחרים בו דבר אחד ומוותרים על אחר."}]},{id:"opportunity",module:"micro",title:"עלות אלטרנטיבית: מה ויתרת עליו?",emoji:"⚖️",points:['כשבוחרים משהו, מוותרים על משהו אחר. מה שוויתרת עליו נקרא "עלות אלטרנטיבית".',"העלות האמיתית של סרט היא לא רק הכרטיס, אלא גם המשחק בחוץ שלא היה.","העלות האלטרנטיבית היא לא כל מה שוויתרת עליו, אלא רק האפשרות הכי טובה שוויתרת עליה.","דוגמה: קנית גלידה ב-8₪. העלות האלטרנטיבית היא חבילת המדבקות שהיית יכול לקנות באותם 8₪.",'שאלה שכדאי לשאול לפני בחירה: "מה אני מוותר עליו אם אבחר בזה?"',"הידעת? גם ללכת לישון מוקדם יש עלות אלטרנטיבית: הסרט או המשחק שהיית מספיק בערב."],quiz:[{q:"בחרת לשחק במחשב במקום ללכת לכדורגל. מה העלות האלטרנטיבית?",options:["החשמל של המחשב","הכדורגל שוויתרת עליו","הכיסא שליד המחשב"],correct:1,why:"העלות האלטרנטיבית היא הדבר הכי טוב שוויתרת עליו."},{q:"יש לך שעתיים פנויות: כדורגל, ספר או סרט. בחרת ספר, ואחריו הכי רצית כדורגל. מה העלות האלטרנטיבית?",options:["הכדורגל","הסרט","גם הכדורגל וגם הסרט"],correct:0,why:"סופרים רק את האפשרות הכי טובה שוויתרת עליה, וזו הכדורגל."},{q:"דנה קנתה בובה ב-40₪, ולכן לא נשאר לה כסף לספר שהיא רצתה. מה העלות האלטרנטיבית של הבובה?",options:["השקית של החנות","הדרך הביתה","הספר שלא קנתה"],correct:2,why:"היא ויתרה על הספר, ולכן הוא העלות האלטרנטיבית."},{q:'אומרים "אין ארוחות חינם". מה הכוונה?',options:["שתמיד משלמים על אוכל בכסף מזומן","שגם כשמשהו נראה חינם, מוותרים על משהו אחר","שאסור לקחת אוכל מהמקרר"],correct:1,why:'גם דבר "בחינם" עולה זמן, מאמץ או אפשרות אחרת.'}]},{id:"supply-demand",module:"micro",title:"היצע וביקוש: הקונים והמוכרים",emoji:"🍦",points:["ביקוש = כמה אנשים רוצים לקנות. כשהמחיר יורד, הביקוש בדרך כלל עולה.","היצע = כמה המוכרים מוכנים למכור. כשהמחיר עולה, שווה למוכרים למכור יותר.",'בנקודה שהקונים והמוכרים "נפגשים" נולד המחיר בשוק.',"דוגמה: בקיץ כולם רוצים גלידה, אז הביקוש עולה. בחורף הביקוש לגלידה קטן בהרבה.","אם המחיר נמוך מדי, הסחורה נגמרת מהר. אם הוא גבוה מדי, הסחורה נשארת על המדף.","הידעת? לפני החגים, כשכולם קונים מתנות, מחירי צעצועים מבוקשים יכולים לעלות בגלל הביקוש הגדול."],game:"supply",quiz:[{q:"המוכר הוריד את המחיר. מה בדרך כלל יקרה?",options:["פחות אנשים ירצו לקנות","יותר אנשים ירצו לקנות","שום דבר לא ישתנה"],correct:1,why:"מחיר נמוך יותר מושך יותר קונים. זה הביקוש."},{q:"יצא סרט חדש על דינוזאורים וכולם רוצים צעצועי דינוזאור. מה יקרה לביקוש ולרוב גם למחיר?",options:["הביקוש עולה והמחיר נוטה לעלות","הביקוש יורד והמחיר יורד","הביקוש עולה אבל המחיר תמיד יורד"],correct:0,why:"כשהרבה אנשים רוצים אותו דבר, הביקוש עולה והמוכרים יכולים לגבות יותר."},{q:"המכולת מכרה לחמניות ב-8₪ וכמעט אף אחד לא קנה. מה כדאי לבעלים לנסות?",options:["להעלות את המחיר עוד","לסגור את החנות לנצח","להוריד קצת את המחיר"],correct:2,why:"מחיר גבוה מדי מרחיק קונים. הורדה קטנה יכולה להחזיר אותם."},{q:"ביום גשום פחות אנשים קונים גלידה. מה קורה?",options:["הביקוש יורד, וההיצע יכול להישאר אותו דבר","הביקוש וההיצע עולים","הביקוש וההיצע נעלמים"],correct:0,why:"פחות קונים = ביקוש נמוך יותר, גם אם למוכר יש אותו מלאי."}]},{id:"incentives",module:"micro",title:"תמריצים: מה גורם לאנשים לפעול",emoji:"🥕",points:["תמריץ הוא משהו שמעודד אותנו לעשות דבר: פרס, הנחה, ציון טוב.","הנחה בחנות? תמריץ לקנות עכשיו. כסף על בקבוקים שמחזירים? תמריץ למחזר.","יש גם תמריצים שליליים: קנס על איחור מעודד אותנו להגיע בזמן.","דוגמה: יום ניקיון חוף עם גלידה חינם למתנדבים. הגלידה היא תמריץ שמעודד אנשים לבוא.","כשמבינים תמריצים, מבינים למה אנשים מתנהגים כמו שהם מתנהגים.","הידעת? בחנויות רבות שמים ממתקים ליד הקופה, כדי לתמרץ אותנו לקניית דחף אחרונה לפני שיוצאים."],quiz:[{q:'החנות מציעה "קנה 2, קבל 1 מתנה". זה...',options:["טעות של החנות","תמריץ לקנות יותר","איסור לקנות"],correct:1,why:"המתנה מעודדת אותך לקנות יותר. זה בדיוק תמריץ."},{q:"העירייה משלמת 2₪ על כל בקבוק שמחזירים למחזור. מה כנראה יקרה?",options:["יותר אנשים יחזירו בקבוקים","פחות אנשים יחזירו","אף אחד לא ישנה כלום"],correct:0,why:"תשלום על החזרה הוא תמריץ חזק למחזר."},{q:"אמא מבטיחה טיפ קטן למי שמסדר את החדר. הטיפ הוא...",options:["מס","חוב","תמריץ"],correct:2,why:"הטיפ נועד לעודד אותך לסדר, וזה תמריץ."},{q:"חנות משחקים נותנת הנחה רק לתלמידים שמציגים תעודת תלמיד. למה לדעתך?",options:["כדי למשוך תלמידים לקנות דווקא אצלה","כי היא שונאת תלמידים","בגלל חוק של הממשלה"],correct:0,why:"ההנחה היא תמריץ שמושך קהל מסוים לחנות."}]},{id:"inflation",module:"macro",title:"אינפלציה: למה 10₪ קונים פחות",emoji:"🎈",points:['לפעמים, לאט לאט, המחירים עולים. לא כי הגלידה גדלה, אלא כי הכסף "שווה" קצת פחות.',"לזה קוראים אינפלציה: אותו סכום קונה פחות דברים מבעבר.","דוגמה: אם כיכר לחם עלתה 5₪ לפני עשר שנים ו-8₪ היום, זו אינפלציה בעבודה.","אינפלציה קטנה ואיטית נחשבת רגילה. אינפלציה מהירה מדי מקשה על משפחות לתכנן קניות וחיסכון.","בגלל זה סבא וסבתא אוהבים לספר שפעם הכל היה זול יותר.","הידעת? היו מקומות בעולם שבהם האינפלציה הייתה כל כך מהירה שהמחירים בחנויות השתנו בין הבוקר לערב!"],quiz:[{q:"אינפלציה היא...",options:["מבצע בסופר","עלייה כללית במחירים לאורך זמן","סוג של מטבע"],correct:1,why:"אינפלציה = מחירים שעולים לאורך זמן, וכל שקל קונה פחות."},{q:"פעם 10₪ קנו שתי גלידות, והיום רק אחת. זה סימן ל...",options:["אינפלציה","גלידה טעימה יותר","קיץ ארוך במיוחד"],correct:0,why:"אותו סכום קונה פחות, זו בדיוק אינפלציה."},{q:"יש אינפלציה של 5% בשנה. מה יקרה בערך למחיר של גלידה ב-10₪ אחרי שנה?",options:["יישאר 10₪ בדיוק","יירד ל-5₪","יעלה לכ-10.5₪"],correct:2,why:"5% מ-10₪ זה חצי שקל, ולכן המחיר עולה לכ-10.5₪."},{q:"איזו דרך עוזרת לכסף לשמור על הערך שלו בזמן אינפלציה?",options:["חיסכון עם ריבית בבנק","להשאיר את השטרות מתחת למזרן","לבזבז הכול מיד"],correct:0,why:"הריבית מוסיפה לכסף ועוזרת לו להדביק את עליית המחירים."}]},{id:"banks",module:"macro",title:"בנקים וריבית: מה הבנק עושה עם הכסף",emoji:"🏦",points:["הבנק שומר את הכסף של אנשים רבים, ומלווה חלקו לעסקים ומשפחות.",'על כסף שחוסכים בבנק מקבלים "ריבית": תשלום קטן על זה שהבנק משתמש בכסף.',"מי שלווה כסף משלם ריבית. מי שחוסך מרוויח ריבית.","דוגמה: הפקדת 100₪ בחיסכון בריבית 3% לשנה. אחרי שנה יהיו לך בערך 103₪, בלי שעשית דבר.","הבנק מרוויח כי הוא גובה מהלווים ריבית גבוהה יותר מזו שהוא משלם לחוסכים.","הידעת? הכסף שרואים בחשבון הבנק לא שוכב בכספת עם השם שלך: הבנק מלווה אותו לאחרים ומחזיר לך כשאתה מבקש."],quiz:[{q:"הפקדת כסף לחיסכון בבנק. מה תקבל עליו?",options:["קנס","ריבית","מדבקה"],correct:1,why:"הבנק משלם ריבית על כסף שחוסכים אצלו."},{q:"מישהו לווה 100₪ מהבנק לשנה. כמה הוא יחזיר?",options:["בדיוק 50₪","יותר מ-100₪, כי יש ריבית","כלום"],correct:1,why:"על הלוואה משלמים ריבית, ולכן מחזירים יותר ממה שלווים."},{q:"הפקדת 200₪ בריבית של 5% לשנה. כמה בערך יהיה לך אחרי שנה?",options:["210₪","205₪","250₪"],correct:0,why:"5% מ-200 זה 10, ולכן 200 ועוד 10 זה 210."},{q:"למה הבנק מוכן לשלם לך ריבית על החיסכון?",options:["כי הוא נחמד","כי חייבים לפי חוק לחלק מתנות","כי הוא משתמש בכסף שלך כדי לתת הלוואות לאחרים"],correct:2,why:"הריבית היא התשלום על השימוש שהבנק עושה בכסף שלך."}]},{id:"trade",module:"macro",title:"עבודה וסחר: כולם מתמחים במשהו",emoji:"🤝",points:["אף אחד לא מייצר לבד את כל מה שהוא צריך. כל אחד מתמחה במשהו.","האופה אופה, החקלאי מגדל, הרופא מרפא, וכולם סוחרים בעזרת כסף.","כסף הופך את הסחר להרבה יותר קל: במקום להחליף לחם בנעליים, מוכרים וקונים בשקלים.","גם מדינות סוחרות ביניהן: ישראל מוכרת תוכנה ופירות, וקונה מכוניות ומוצרי חשמל, למשל.","דוגמה: המכונית שאתם נוסעים בה יכולה להיות מורכבת מחלקים שיוצרו בחמש מדינות שונות.",'הידעת? לפני שהומצא הכסף סחרו ב"סחורה תמורת סחורה", למשל שק קמח תמורת עז. תארו לעצמכם לקנות גלידה בעזרת עז!'],quiz:[{q:"למה אנשים מתמחים בעבודה אחת?",options:["כי אסור ללמוד שני מקצועות","כך כולם מקבלים יותר דברים טובים בפחות מאמץ","כי אין ברירה אחרת"],correct:1,why:"כשכל אחד טוב במשהו אחד וסוחרים, כולם מרוויחים."},{q:"ישראל מייצרת הרבה תוכנה אבל כמעט לא מגדלת בננות. מה הסחר עם מדינות אחרות מאפשר?",options:["לאכול בננות בלי לגדל אותן כאן","להפסיק לכתוב תוכנה","שכל מדינה תאכל רק מה שהיא מגדלת"],correct:0,why:"כל מדינה טובה במשהו אחר, והסחר מחבר ביניהן."},{q:"האופה צריך נעליים חדשות. מה הוא יעשה בדרך כלל?",options:["יתפור נעליים לבד","ילך יחף","ימכור לחם ויקנה נעליים בכסף"],correct:2,why:"במקום לייצר הכל לבד, הוא מתמחה בלחם וקונה את השאר."},{q:"למה כסף נוח יותר מהחלפת סחורות?",options:["כי אין צורך למצוא מישהו שרוצה בדיוק את מה שיש לך","כי שטרות יפים יותר","כי ככה אין צורך לעבוד"],correct:0,why:"בסחורה תמורת סחורה צריך התאמה מושלמת של רצונות, ועם כסף לא."}]},{id:"flow",module:"macro",title:"הכסף נע במעגל",emoji:"🔄",points:["כשאמא קונה לחם, הכסף עובר למאפייה. המאפייה משלמת לעובדים ולספק הקמח.","העובדים קונים בגדים, חנות הבגדים משלמת לעובדים שלה, והמעגל ממשיך.","הכלכלה היא כמו מעגל ענק שבו הכסף זז כל הזמן בין אנשים.","דוגמה: הקופאית בסופר מקבלת משכורת, קונה בה נעליים, וחנות הנעליים משלמת למוכרת שלה.","כשאנשים מרוויחים יותר, הם גם קונים יותר, והמעגל מתחזק. כשקונים פחות, המעגל נחלש.",'הידעת? כלכלנים קוראים לזה "המחזור הכלכלי", והוא מחבר בין כמעט כל אדם במדינה.'],quiz:[{q:"אבא קנה פיצה ב-50₪. לאן הכסף ממשיך?",options:["הוא נשאר בקופה לנצח","הוא נעלם","למשכורות, לרכיבים ולשכירות של הפיצרייה"],correct:2,why:"הכסף לא עוצר, הוא ממשיך הלאה במעגל."},{q:"המאפייה הרוויחה היום 1,000₪. מה כנראה יקרה לרוב הכסף?",options:["יחולק למשכורות, קמח, שכירות וחשמל","יישמר בקופה לעולם","יושמד"],correct:0,why:"ההכנסות של עסק ממשיכות לזרום לכל מי שעובד איתו."},{q:"אם פתאום אף אחד לא קונה כלום, מה קורה למעגל?",options:["הוא גדל","הוא נחלש: פחות משכורות ופחות קניות","כלום לא משתנה"],correct:1,why:"המעגל מחזיק בזכות הקניות של כולם."},{q:"אם הרבה אנשים מאבדים את העבודה, מה קורה למעגל הכלכלי?",options:["הם קונים פחות, עסקים מרוויחים פחות, והמעגל נחלש עוד","המעגל מתחזק","המחירים יורדים לאפס"],correct:0,why:"פחות הכנסה = פחות קניות = פחות הכנסות לעסקים. הכול מחובר."}]},{id:"budget",module:"money",title:"צרכים, רצונות ותקציב",emoji:"📝",points:['"צריך": דברים שחייבים, כמו אוכל, בית, ביגוד, בריאות ולימודים.','"רוצה": דברים שכיף לקבל, כמו ממתקים, משחקים וצעצועים.','תקציב חכם: קודם מכסים את מה שצריך, שמים קצת בצד לחיסכון, ואז בוחרים מ"מה שרוצים".',"דוגמה לתקציב שבועי מ-30₪ דמי כיס: 10₪ לחיסכון, 5₪ בצד להפתעות, ו-15₪ לצרכים ורצונות.",'כדאי לרשום על מה הוצאת כל שקל. כך מגלים לאן הכסף "נעלם" וקל יותר לתכנן.',"הידעת? גם ממשלות עובדות עם תקציב: הן מחליטות כמה כסף ילך לחינוך, לבריאות ולכבישים."],game:"needs",quiz:[{q:'איזה מהבאים הוא "צורך"?',options:["סוכריה על מקל","נעליים לבית ספר","משחק מחשב"],correct:1,why:"נעליים צריך. סוכריה ומשחק זה כיף, אבל לא חובה."},{q:"קיבלת 50₪. חסכת 20₪ וקנית צרכים ב-20₪. כמה נשאר לרצונות?",options:["10₪","20₪","50₪"],correct:0,why:"50 פחות 20 פחות 20 = 10. תקציב עוזר לדעת כמה נשאר."},{q:'מה הבעיה בלקנות קודם את כל ה"רוצה" ורק אחר כך את ה"צריך"?',options:["אין שום בעיה","הסוכריות נגמרות מהר","עלול להישאר בלי כסף לדברים שבאמת צריך"],correct:2,why:"לכן הסדר הנכון הוא: צריך, חיסכון, ואז רוצה."},{q:"מה עוזר לחסוך למטרה גדולה?",options:["לשים בצד סכום קבוע כל שבוע","לקנות כל דבר שיש עליו מבצע","לבקש עוד דמי כיס כל יום"],correct:0,why:"סכום קטן וקבוע מצטבר להפתעה גדולה."}]},{id:"compound",module:"money",title:"ריבית דריבית: הכסף שגדל לבד",emoji:"❄️",points:["חיסכון בבנק מרוויח ריבית. בשנה הבאה מרוויחים ריבית גם על הריבית שכבר קיבלנו!","זה נקרא ריבית דריבית: כמו כדור שלג שמתגלגל וגדל.","דוגמה: 100₪ בריבית 10% לשנה. אחרי שנה 110₪, ואחרי שנתיים 121₪, כי הריבית של השנה השנייה מחושבת על 110.","ככל שמתחילים מוקדם יותר, הכדור מספיק לגדול יותר. נסו את סימולציית החיסכון!","אותו כסף בקופת חזיר בבית לא גדל בכלל: אין שם ריבית, ובזמן אינפלציה הוא אפילו קונה פחות.","הידעת? מספרים על אלברט איינשטיין שאמר שריבית דריבית היא הפלא השמיני של תבל."],quiz:[{q:"ריבית דריבית אומרת ש...",options:["משלמים הכול פעמיים","מרוויחים ריבית גם על הריבית שכבר קיבלנו","הריבית נגמרת אחרי שנה"],correct:1,why:"כל שנה הריבית מצטרפת לחיסכון ומרוויחה בעצמה."},{q:"100₪ בריבית של 10% לשנה. כמה בערך יהיה אחרי שנתיים?",options:["120₪","200₪","121₪"],correct:2,why:"אחרי שנה יש 110₪, ו-10% מ-110 זה 11, ולכן 121. זה הכוח של הריבית על הריבית!"},{q:"מי ירוויח יותר מריבית דריבית?",options:["מי שהתחיל לחסוך מוקדם","מי שחיכה עד גיל 60","אין הבדל בכלל"],correct:0,why:"לזמן יש כוח ענק. התחלה מוקדמת שווה הרבה."},{q:"מה עוזר לריבית דריבית לעבוד חזק יותר?",options:["לבדוק את הכסף כל יום","לקנות ממתקים בדרך","זמן: ככל שחוסכים יותר שנים"],correct:2,why:"הריבית מצטברת שנה אחר שנה, ולכן זמן הוא החבר הכי טוב של החוסך."}]},{id:"investing",module:"money",title:"השקעות וסיכון: לתת לכסף לעבוד",emoji:"📈",points:["השקעה אומרת לתת לכסף לעבוד בשבילך, עם סיכוי לרווח וגם סיכון להפסיד.","דוגמה: לקנות חלק קטן בחברה (מניה) זה כמו להיות שותף זעיר: אם החברה מצליחה, אתה מרוויח, ואם לא, אפשר להפסיד.","פיזור, כלומר לא לשים את כל הכסף במקום אחד, מקטין סיכון. כמו לא לשים את כל הביצים בסל אחד.","כלל אצבע: מובטח לך רווח ענק בלי סיכון? כנראה שזה סיכון גדול, או רמאות.","לא משקיעים כסף שצריך לאוכל או למקרי חירום. האפליקציה מסבירה, אבל לא ממליצה על שום השקעה.","הידעת? רוב המשקיעים המבוגרים משקיעים לטווח ארוך, כי לאורך שנים העליות והירידות נוטות להתאזן."],quiz:[{q:"מה נכון לגבי השקעות?",options:["תמיד מרוויחים","תמיד מפסידים","אפשר להרוויח ואפשר גם להפסיד"],correct:2,why:"סיכוי וסיכון הולכים ביחד. זה הכלל הראשון."},{q:'"תשקיע 100₪ ותקבל 1,000₪ מחר, בלי סיכון בכלל!" זה כנראה...',options:["רמאות","הזדמנות נדירה","מתנה מהבנק"],correct:0,why:"רווח ענק מובטח בלי סיכון הוא הסימן המספר אחד לרמאות."},{q:'מה הכוונה בביטוי "לא שמים את כל הביצים בסל אחד"?',options:["לקנות הרבה ביצים","לפזר את הכסף בין כמה דברים כדי להקטין סיכון","לשמור ביצים במקומות שונים במטבח"],correct:1,why:"אם סל אחד נופל, לא כל הביצים נשברות. כך גם עם כסף."},{q:"באיזה כסף לא משקיעים?",options:["בכסף שצריך לדברים חיוניים","בכסף שייעדנו לחיסכון ארוך","במתנה שחסכנו במיוחד לזה"],correct:0,why:"כסף חיוני חייב להישאר בטוח וזמין."}]},{id:"scams",module:"money",title:"זהירות: הונאות וחובות",emoji:"🕵️",points:["רמאים מבטיחים מתנות ופרסים כדי לגנוב פרטים או כסף. לעולם לא נותנים סיסמאות או פרטי כרטיס.","חוב הוא כסף שלווים וצריך להחזיר, בדרך כלל עם ריבית. קל להיכנס אליו וקשה לצאת ממנו.","דוגמה לחוב: לווית 20₪ מחבר להופעה, והבטחת להחזיר 25₪. ה-5₪ הנוספים הם כמו ריבית.",'סימני אזהרה להונאה: דחיפות ("רק עכשיו!"), בקשה לסיסמה, הבטחה לפרס ענק, ושולח שלא מכירים.',"כלל זהב: הצעה טובה מדי כדי להיות אמיתית? תמיד בודקים עם מבוגר לפני כל דבר.","הידעת? רמאים מתחזים לפעמים לבנק או לחברת משלוחים בהודעות שנראות רשמיות מאוד. בודקים תמיד מול מבוגר."],game:"scam",quiz:[{q:'הודעה: "זכית באייפון! שלח מספר כרטיס אשראי". מה עושים?',options:["מוחקים ומספרים למבוגר","שולחים מהר לפני שהפרס נגמר","מעבירים לכל החברים"],correct:0,why:"פרס אמיתי לעולם לא מבקש פרטי כרטיס."},{q:"מה זה חוב?",options:["מתנה שלא מחזירים","סוג של מטבע","כסף שלווים וצריך להחזיר, בדרך כלל עם ריבית"],correct:2,why:"חוב תמיד חוזר עם ריבית, ולכן נכנסים אליו בזהירות."},{q:'הודעה: "החשבון שלך יינעל בעוד שעה! לחץ כאן מיד והזן סיסמה". מה סימן האזהרה העיקרי?',options:["שיש סימן קריאה בהודעה","הדחיפות והבקשה לסיסמה","ששלחו את ההודעה בבוקר"],correct:1,why:"דחיפות ובקשה לסיסמה הם שני סימני האזהרה הקלאסיים של רמאים."},{q:"למי כן שולחים סיסמה?",options:["לאף אחד, גם לא ל'בנק' ששולח הודעה","לכל מי שמבקש יפה","לפרסומת צבעונית"],correct:0,why:"סיסמה אישית לא נותנים לאף אחד, בלי יוצא מן הכלל."}]},{id:"stock-market",module:"money",title:"שוק ההון: חתיכה קטנה מחברה",emoji:"📈",points:["מניה היא חלק קטן בבעלות על חברה. חברה יכולה למכור מניות כדי לגייס כסף לצמיחה. בבורסה אנשים קונים ומוכרים מניות זה לזה; בקנייה מאדם אחר הכסף מגיע למוכר, לא לחברה.","מחיר המניה משתנה לפי מה שקונים ומוכרים מוכנים לשלם. תוצאות החברה, ציפיות וחדשות כלליות משפיעות. גם דיווח טוב לא מבטיח שהמחיר יעלה.","מידע אינו כדור בדולח. דיווח מאומת שונה משמועה; וכשאין מידע, לא נכון להניח שהכל טוב. מותר להחליט לא לקנות.","פיזור בין חברות מענפים שונים יכול להקטין את הנזק אם חברה אחת מסתבכת. הוא לא מבטל סיכון: חברות רבות יכולות לרדת יחד. גם סבלנות אינה מבטיחה רווח.","דוגמה: קנית 10 מניות במחיר 5 ₪ למניה ושילמת עמלת קנייה של 1 ₪: הוצאת 51 ₪. מכרת ב-6 ₪ למניה בלי עמלת מכירה וקיבלת 60 ₪. הרווח הוא 9 ₪, לא 10 ₪. אם המחיר היה יורד, היה הפסד.","הידעת? מדד הוא כמו לוח תוצאות של קבוצת מניות. השוואה למדד עוזרת לשאול: האם הבחירות שלי הצליחו יותר מהשוק כולו? במשחק נשווה גם למזומן, ונזכור ששנה אחת אינה מוכיחה שיטה."],quiz:[{q:"דיווח אמיתי אומר שלחברה יש יותר לקוחות. מה אפשר לד
